[package]
name = "something"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "raylib_imgui_rs",
    "."
]

[dependencies]
clap = { version = "4.6.1", features = [ 'derive' ] }
i_overlay = "7.0.2"
i_triangle = "0.45.1"
itertools = "0.15.0"
nalgebra = "0.35.0"
ordered-float = { version = "5.3.0", features = [ 'serde' ] }
raylib = {version = "6.0.0", features = ["SUPPORT_IMAGE_GENERATION"]}
serde = { version = "1.0.228", features = [ 'derive' ] }
serde_json = "1.0.150"
uuid = { version = "1.24.0", features = [ "v7", "serde" ] }
raylib_imgui_rs = { path = "./raylib_imgui_rs" }
imgui = "0.12.0"
